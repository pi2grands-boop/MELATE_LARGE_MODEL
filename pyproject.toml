[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "melate"
version = "0.1.0"
description = "Auditoría estadística y valor esperado de Melate, Revancha y Revanchita. No predice números."
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.3,<3",
    "pandas>=2.3,<3",
    "scipy>=1.14,<2",
    "scikit-learn>=1.5,<2",
    "requests>=2.32,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "lento: tarda minutos (2000 simulaciones o backtest completo)",
    "red: necesita internet",
]
